name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: tests (${{ matrix.os }})
    # macos-latest roda o mesmo Bash 3.2 do macOS do dia a dia; o ubuntu cobre o Bash 5 / GNU.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe (bash -n)
        run: |
          set -e
          for f in skills/*/scripts/*.sh skills/*/tests/*.sh hooks/*.sh hooks/tests/*.sh statusline/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Versões
        run: bash --version | head -1 && git --version

      - name: Manifesto do plugin
        run: python3 -c "import json; m = json.load(open('.claude-plugin/plugin.json')); assert m['name'] == 'skills', m"

      - name: branch-diff-report
        run: bash skills/branch-diff-report/tests/run-tests.sh

      - name: pr-worktree
        run: bash skills/pr-worktree/tests/run-tests.sh

      - name: plan-and-execute
        run: bash skills/plan-and-execute/tests/run-tests.sh

      - name: hook confirmar-comandos
        run: bash hooks/tests/run-tests.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning skills/*/scripts/*.sh skills/*/tests/*.sh hooks/*.sh hooks/tests/*.sh statusline/*.sh

  plugins:
    name: plugins
    # Valida manifesto, skills, agents e hooks dos dois plugins com a própria CLI do Claude Code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validar o plugin skills
        run: claude plugin validate .
      - name: Validar o mod prompt-rewriter
        run: claude plugin validate mods/prompt-rewriter
